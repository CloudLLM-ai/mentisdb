[package]
name = "mentisdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0.1", features = ["serde"] }
url = "2"
mentisdb = { path = "..", default-features = false, features = ["server"] }

# Its own workspace keeps the fuzz crate out of the parent's builds, clippy
# runs and published tarball.
[workspace]
members = ["."]

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_record"
path = "fuzz_targets/policy_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_envelope"
path = "fuzz_targets/signature_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thought_payload_v2"
path = "fuzz_targets/thought_payload_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain_key"
path = "fuzz_targets/chain_key.rs"
test = false
doc = false

[[bin]]
name = "migration_record"
path = "fuzz_targets/migration_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_chain"
path = "fuzz_targets/migration_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_auth_header"
path = "fuzz_targets/read_auth_header.rs"
test = false
