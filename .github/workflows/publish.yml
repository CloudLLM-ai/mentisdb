name: Publish pymentisdb to PyPI

on:
  push:
    tags:
      - "pymentisdb-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pymentisdb/

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Build from the repository root: Python started inside pymentisdb/
      # imports pymentisdb/types.py in place of the standard library `types`.
      - name: Build pymentisdb distribution
        run: |
          python3 -m pip install build --quiet
          python3 -m build pymentisdb

      - name: Check the wheel contains the package
        run: |
          python3 -m zipfile -l pymentisdb/dist/*.whl | grep -q 'pymentisdb/client.py'

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pymentisdb/dist
          skip-existing: true
