name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --all-features

      - name: Run cookbook-as-test (extract + compile every code example)
        run: |
          python3 scripts/extract_cookbook_examples.py docs/cookbook/
          cargo test --test cookbook_tests --all-features

# Cookbook-as-test: every Rust code example in docs/cookbook/*.html
# is extracted and compiled. If a chapter claims the library does X,
# this proves it. See scripts/extract_cookbook_examples.py and
# chapter 0.5 of the cookbook.
