name: Build

on:
  push:
    branches: ["master", "main"]
    tags: ["*"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: mentisdb (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mentisdb
            artifact: mentisdb-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mentisdb
            artifact: mentisdb-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mentisdb
            artifact: mentisdb-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mentisdb
            artifact: mentisdb-macos-x86_64
            # ort-sys (pulled in by fastembed via `local-embeddings`) ships no
            # prebuilt ONNX Runtime for x86_64-apple-darwin, so the Intel macOS
            # binary is built without local embeddings (all other default
            # features are kept). Mention this in release notes.
            cargo_features: --no-default-features --features server,startup-sound,llm-extraction
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mentisdb.exe
            artifact: mentisdb-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Build mentisdb (release)
        run: cargo build --bin mentisdb --release --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      - name: Stage target-specific binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          test -s "dist/${{ matrix.artifact }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 30

      # On tagged releases, attach binaries to the GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}
