[package]
name = "mentisdb"
version = "0.10.7"
authors = ["Angel Leon <gubatron@gmail.com>"]
edition = "2021"
license = "MIT"
description = "Semantic, hash-chained durable memory for long-running and multi-agent systems."
repository = "https://github.com/CloudLLM-ai/mentisdb"
documentation = "https://docs.rs/mentisdb/latest/mentisdb/"
readme = "README.md"
keywords = ["agents", "memory", "event-sourcing", "llm", "orchestration"]
categories = ["data-structures", "development-tools", "asynchronous"]
exclude = ["data/", "docs/", "lme-benches/", ".fastembed_cache/", ".github/", "start_mentisdb"]

[features]
default = ["server", "startup-sound", "llm-extraction", "local-embeddings"]
server = ["dep:axum", "dep:env_logger", "dep:if-addrs", "dep:log", "dep:tokio", "mcp/server", "dep:rcgen", "dep:axum-server", "dep:rustls-pemfile", "dep:x509-parser", "dep:reqwest", "dep:rustls"]
startup-sound = ["dep:rodio"]
local-embeddings = ["dep:fastembed", "dep:rustls"]
llm-extraction = ["dep:openai-rust2", "dep:anyhow"]

[dependencies]
async-trait = "0.1.89"
# WARNING: do not update bincode to 3.0.0, it's not functional
bincode = { version = "2.0.1", features = ["serde"] }
dashmap = "6"
rust-stemmers = "1"
subtle = "2.6"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
diffy = "0.4"
ed25519-dalek = { version = "2", features = ["alloc"] }
sha2 = "0.10.9"
crossterm = "0.28"
ratatui = "0.30.0"
toml_edit = "0.22.27"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
mcp = { package = "cloudllm_mcp", version = "0.3.5" }
axum = { version = "0.8.8", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
if-addrs = { version = "0.15", optional = true }
env_logger = { version = "0.11.8", optional = true }
log = { version = "0.4.28", optional = true }
rcgen = { version = "0.14", optional = true }
time = "0.3.49"
rustls-pemfile = { version = "2", optional = true }
x509-parser = { version = "0.18", optional = true }
rodio = { version = "0.22", optional = true }
tokio = { version = "1.50.0", features = ["full"], optional = true }
fastembed = { version = "5.13.1", optional = true }
# Needed to install an explicit rustls crypto provider.  The server feature
# pulls in rustls transitively via axum-server and reqwest; when both aws-lc-rs
# and ring are compiled in, rustls refuses to auto-select a default provider.
rustls = { version = "0.23", features = ["ring"], optional = true }
ureq = { version = "2", features = ["json"] }
url = "2.5.8"
arboard = { version = "3", default-features = false }
dotenvy = "0.15"
openai-rust2 = { version = "1.7.2", optional = true }
anyhow = { version = "1", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
# HNSW approximate-nearest-neighbor backend (H1). Pure Rust, no_std-friendly
# core. Unconditionally compiled in since 0.10.4.49 — the exact f32 linear-scan
# path remains the fallback for small sidecars; once a managed sidecar exceeds
# `MENTISDB_HNSW_THRESHOLD` (default 50,000 vectors) MentisDB switches to the
# HNSW backend automatically. The public API and hybrid/ranked search semantics
# are unchanged.
hnsw = { version = "0.11", features = ["serde1"] }
rand_pcg = { version = "0.3", features = ["serde1"] }
space = "0.17"
# Compressed bitmap set for vector metadata filters (H2). Always built-in:
# it has no heavy dependencies, keeps the public API uniform across feature
# combinations, and is usable with both Exact and HNSW backends.
roaring = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
reqwest = { version = "0.13.2", features = ["json", "rustls"], optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.2", features = ["json", "native-tls"], optional = true, default-features = false }

[dev-dependencies]
# WARNING: do not update bincode to 3.0.0, it's not functional
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
criterion = { version = "0.5", features = ["html_reports"] }
ed25519-dalek = { version = "2", features = ["alloc"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
x509-parser = "0.18"

[[bench]]
name = "thought_chain"
harness = false

[[bench]]
name = "skill_registry"
harness = false

[[bench]]
name = "http_concurrency"
harness = false

[[bench]]
name = "search_baseline"
harness = false

[[bench]]
name = "search_ranked"
harness = false

[[bench]]
name = "hnsw_comparison"
harness = false

[[bench]]
name = "hnsw_scale"
harness = false

[[bin]]
name = "mentisdb"
path = "src/bin/mentisdb.rs"
required-features = ["server"]
