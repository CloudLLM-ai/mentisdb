[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymentisdb"
version = "0.10.1"
description = "Python client for MentisDB - semantic hash-chained memory for agents"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Angel Leon", email = "gubatron@gmail.com"}
]
keywords = ["agents", "memory", "llm", "langchain", "semantic-memory", "mentisdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
signing = [
    "cryptography>=42.0.0",
]
langchain = [
    "langchain-core>=0.1.0",
    # langchain-core 1.0 moved BaseMemory to langchain-classic
    "langchain-classic>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CloudLLM-ai/mentisdb"
Documentation = "https://docs.rs/mentisdb/latest/mentisdb/"
Repository = "https://github.com/CloudLLM-ai/mentisdb"
Issues = "https://github.com/CloudLLM-ai/mentisdb/issues"

# This directory is the package itself (pymentisdb/__init__.py), so map the
# package name onto it. `packages.find` here found nothing: the 0.9.0 wheel on
# PyPI holds only metadata. Build from the repository root
# (`python -m build pymentisdb`): running Python inside this directory lets
# pymentisdb/types.py shadow the standard library's `types`.
[tool.setuptools]
package-dir = {"pymentisdb" = "."}
packages = ["pymentisdb"]

[tool.setuptools.package-data]
pymentisdb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
